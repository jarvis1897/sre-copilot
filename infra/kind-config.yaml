# Local cluster for M0+: 1 control-plane + 2 workers, so network faults cross real node boundaries.
#
# The node image is pinned by digest and must match the kind release that built it
# (KIND_VERSION in the root Makefile). Pre-built images and digests are listed in each kind
# release's notes: https://github.com/kubernetes-sigs/kind/releases
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: sre-copilot
nodes:
  - role: control-plane
    image: &node-image kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
  - role: worker
    image: *node-image
  - role: worker
    image: *node-image
