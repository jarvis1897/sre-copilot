# Minimal Alertmanager webhook receiver: logs one JSON line per alert to stdout and returns 200.
# Stand-in for the copilot's alert intake (M3+). Payloads are untrusted data: logged, never acted on.
apiVersion: v1
kind: ConfigMap
metadata:
  name: alert-webhook
  namespace: observability
data:
  server.py: |
    import json
    import sys
    from http.server import BaseHTTPRequestHandler, HTTPServer

    MAX_BODY = 1 << 20  # 1 MiB


    class Handler(BaseHTTPRequestHandler):
        def do_POST(self):
            length = int(self.headers.get("Content-Length") or 0)
            if self.path != "/alerts" or length > MAX_BODY:
                self.send_response(404 if self.path != "/alerts" else 413)
                self.end_headers()
                return
            try:
                payload = json.loads(self.rfile.read(length))
            except ValueError:
                self.send_response(400)
                self.end_headers()
                return
            for alert in payload.get("alerts", []):
                print(json.dumps({
                    "receiver": payload.get("receiver"),
                    "status": alert.get("status"),
                    "alertname": alert.get("labels", {}).get("alertname"),
                    "labels": alert.get("labels"),
                    "annotations": alert.get("annotations"),
                    "startsAt": alert.get("startsAt"),
                    "endsAt": alert.get("endsAt"),
                }), flush=True)
            self.send_response(200)
            self.end_headers()

        def do_GET(self):  # readiness
            self.send_response(200 if self.path == "/healthz" else 404)
            self.end_headers()

        def log_message(self, *args):  # keep stdout to alert lines only
            pass


    if __name__ == "__main__":
        print("alert-webhook listening on :8080", file=sys.stderr, flush=True)
        HTTPServer(("", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-webhook
  namespace: observability
  labels:
    app.kubernetes.io/name: alert-webhook
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alert-webhook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alert-webhook
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alert-webhook
          # python:3.13-slim (3.13.16), pinned by index digest.
          image: python@sha256:bf44cdfcb76cd3b41e879bc058fc37ec5872002ccfde7fcb765e218cde0cd79c
          command: ["python", "-u", "/app/server.py"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
      volumes:
        - name: app
          configMap:
            name: alert-webhook
---
apiVersion: v1
kind: Service
metadata:
  name: alert-webhook
  namespace: observability
  labels:
    app.kubernetes.io/name: alert-webhook
spec:
  selector:
    app.kubernetes.io/name: alert-webhook
  ports:
    - name: http
      port: 8080
      targetPort: http
