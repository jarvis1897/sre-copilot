# Overrides for the open-telemetry/opentelemetry-demo chart (version in infra/versions.env).
# Keep customizations here rather than in --set flags.

# The chart's bundled telemetry backends stay on until our own M0 stack (Prometheus, Loki,
# Tempo/Jaeger, Grafana, Alertmanager) is deployed; then flip these to false and point the
# collector's exporters at our stack. Listed explicitly so the switch is a one-line change.
jaeger:
  enabled: true
prometheus:
  enabled: true
grafana:
  enabled: true
opensearch:
  enabled: true
